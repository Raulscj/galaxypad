name: Build GalaxyPad IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar la version mas reciente de Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Usando Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Preparar herramientas
        run: brew install cmake ninja

      - name: Etapa 1 - Dependencias
        run: bash scripts/bootstrap-dependencies.sh

      - name: Parchear HookableEvent.h para compatibilidad con C++
        run: |
          FILE="ref/ModernGekko/vendor/dolphin/Source/Core/Common/HookableEvent.h"
          if [ -f "$FILE" ]; then
            sed -i '' 's/std::make_unique<Listener>(std::move(callback))/std::unique_ptr<Listener>(new Listener{std::move(callback)})/g' "$FILE"
            echo "Parche aplicado correctamente en $FILE"
          fi

      - name: Etapa 2 - Runtime (Core)
        run: bash scripts/build-ios-simulator-core.sh
        env:
          GALAXYPAD_IOS_SDK: iphoneos
          GALAXYPAD_BUILD_JOBS: 4

      - name: Etapa 3 - Engine
        run: bash scripts/build-ios-engine.sh
        env:
          GALAXYPAD_IOS_SDK: iphoneos
          GALAXYPAD_BUILD_JOBS: 4

      - name: Etapa 4 - App
        run: bash scripts/build-ios-simulator-app.sh
        env:
          GALAXYPAD_IOS_SDK: iphoneos

      - name: Etapa 5 - Empaquetado
        run: bash scripts/package-padmint-ipa.sh GalaxyPad.ipa

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPad-IPA
          path: GalaxyPad.ipa
