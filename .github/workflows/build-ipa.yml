name: Build GalaxyPad IPA
on: [workflow_dispatch]

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: brew install cmake ninja ripgrep

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Record toolchain
        run: |
          xcodebuild -version
          clang --version

      - name: Check out pinned Apple build sources
        run: bash scripts/bootstrap-dependencies.sh

      - name: Build the iOS runtime and app
        env:
          GALAXYPAD_IOS_SDK: iphoneos
        run: |
          bash scripts/build-ios-simulator-core.sh
          bash scripts/build-ios-engine.sh
          bash scripts/build-ios-simulator-app.sh

      - name: Package IPA
        run: bash scripts/package-padmint-ipa.sh GalaxyPad.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPad-IPA
          path: GalaxyPad.ipa
